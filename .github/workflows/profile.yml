name: Refresh public GitHub profile
# The lifetime SVG is generated from verified npm receipts, not a live badge.
# Refresh npm once a day; only changes to this workflow trigger an initial run.
on:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'theihtishaam/theihtishaam'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public statistics, projects, avatar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node tools/refresh.mjs
          else
            node --check tools/refresh.mjs
            node --test tools/profile-metrics.test.mjs
            node tools/refresh.mjs --npm-only
          fi
      - name: Commit changed public data
        run: |
          git config user.name "theihtishaam"
          git config user.email "59793939+theihtishaam@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git add -- README.md assets/repos assets/npm-packages data/npm-packages.json docs/npm-packages.json assets/statistics.svg assets/recent-projects.svg assets/face-scan.svg docs/PUBLIC_PROJECTS.md data/github-stats.json data/public-projects.json docs/github-stats.json docs/public-projects.json assets/npm-milestone.svg data/npm-metrics.json docs/npm-metrics.json docs/assets/npm-milestone.svg
          else
            git add -- README.md assets/npm-packages/lifetime.svg data/npm-packages.json docs/npm-packages.json data/npm-metrics.json docs/npm-metrics.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh public GitHub profile"
          git push
