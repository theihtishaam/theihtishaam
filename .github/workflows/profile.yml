name: Refresh public GitHub profile
on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/face-scan.template.svg'
      - 'assets/npm-milestone.template.svg'
      - 'tools/refresh.mjs'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: public-profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'theihtishaam/theihtishaam'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public statistics, projects, avatar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/refresh.mjs
      - name: Commit changed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/statistics.svg assets/recent-projects.svg assets/face-scan.svg docs/PUBLIC_PROJECTS.md data/github-stats.json data/public-projects.json assets/npm-milestone.svg data/npm-metrics.json docs/npm-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh public GitHub profile"
          git push
