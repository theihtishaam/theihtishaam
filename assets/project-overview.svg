<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="298" viewBox="0 0 1200 298" role="img" aria-label="Project overview: Agent Shadow Brain for coding agent memory, CivicTwin Delta for regulatory evidence, and ProcureGuard AI for vendor approval governance"><defs><linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03060F"/><stop offset=".48" stop-color="#0D1027"/><stop offset="1" stop-color="#041821"/></linearGradient><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42F5E3"/><stop offset=".5" stop-color="#9F83FF"/><stop offset="1" stop-color="#FF5FAE"/></linearGradient><radialGradient id="fog"><stop stop-color="#5B4BBF" stop-opacity=".38"/><stop offset="1" stop-color="#1A1B35" stop-opacity="0"/></radialGradient><pattern id="mesh" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#9ECDE4" stroke-opacity=".075" fill="none"/></pattern></defs><style>@keyframes orbit{to{stroke-dashoffset:-360}}@keyframes glint{50%{opacity:.25}}@keyframes slide{0%{transform:translateX(-35px)}100%{transform:translateX(390px)}}@keyframes drift{50%{transform:translateY(-6px)}}.spider{animation:orbit 25s linear infinite}.node{animation:glint 3.5s ease-in-out infinite}.drift{animation:drift 6s ease-in-out infinite}.scan{animation:slide 8s ease-in-out infinite alternate}@media(prefers-reduced-motion:reduce){.spider,.node,.drift,.scan{animation:none}}</style><rect width="1200" height="298" rx="19" fill="url(#space)"/><rect width="1200" height="298" rx="19" fill="url(#mesh)"/><text x="26" y="42" fill="#7CF5E8" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="850" letter-spacing="3">PROJECT ECOSYSTEM  /  THREE PUBLIC SYSTEMS</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="27" y="67" width="369" height="190" rx="15" fill="#151F38" stroke="#5CF1E7" stroke-opacity=".72" stroke-width="2"/><rect x="41" y="80" width="55" height="31" rx="10" fill="#283150"/><text x="68" y="102" text-anchor="middle" font-size="17" font-weight="850" fill="#5CF1E7">01</text><text x="44" y="148" font-size="23" font-weight="900" fill="#F8FAFF">AGENT SHADOW BRAIN</text><text x="44" y="183" font-size="16" font-weight="800" fill="#5CF1E7">CODE INTELLIGENCE</text><text x="44" y="223" font-size="16" fill="#B3C4E1">Memory • context • MCP</text><path d="M42 241h160" stroke="#5CF1E7" stroke-width="3" stroke-opacity=".7"/><rect x="419" y="67" width="369" height="190" rx="15" fill="#151F38" stroke="#B7A0FF" stroke-opacity=".72" stroke-width="2"/><rect x="433" y="80" width="55" height="31" rx="10" fill="#283150"/><text x="460" y="102" text-anchor="middle" font-size="17" font-weight="850" fill="#B7A0FF">02</text><text x="436" y="148" font-size="26" font-weight="900" fill="#F8FAFF">CIVICTWIN DELTA</text><text x="436" y="183" font-size="16" font-weight="800" fill="#B7A0FF">RULE INTELLIGENCE</text><text x="436" y="223" font-size="16" fill="#B3C4E1">Evidence • scenarios • proof</text><path d="M434 241h160" stroke="#B7A0FF" stroke-width="3" stroke-opacity=".7"/><rect x="811" y="67" width="369" height="190" rx="15" fill="#151F38" stroke="#FF94CA" stroke-opacity=".72" stroke-width="2"/><rect x="825" y="80" width="55" height="31" rx="10" fill="#283150"/><text x="852" y="102" text-anchor="middle" font-size="17" font-weight="850" fill="#FF94CA">03</text><text x="828" y="148" font-size="26" font-weight="900" fill="#F8FAFF">PROCUREGUARD AI</text><text x="828" y="183" font-size="16" font-weight="800" fill="#FF94CA">DECISION GOVERNANCE</text><text x="828" y="223" font-size="16" fill="#B3C4E1">Agents • review • human gate</text><path d="M826 241h160" stroke="#FF94CA" stroke-width="3" stroke-opacity=".7"/></g><text x="28" y="282" fill="#A8B9D5" font-family="Segoe UI,Arial,sans-serif" font-size="13">Each project has its own source repository, demo links, and illustrated case study.</text></svg>