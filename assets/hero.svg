 <text x="1037" y="186" font-size="12" fill="#8DE7F0" font-weight="700" letter-spacing="2">BUILD STATUS</text>
 <text x="1037" y="210" font-size="17" fill="#F4F8FF" font-weight="700">ALWAYS CREATING</text>
 <rect x="982" y="290" width="288" height="45" rx="12" fill="#101B34" stroke="#A18CFF" stroke-opacity=".75"/>
