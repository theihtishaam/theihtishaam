<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="418" viewBox="0 0 1400 418" role="img" aria-label="Ihtisham Ahmad — engineering tomorrow with AI, full stack software and automation. Animated futuristic neon portfolio header">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1E"/><stop offset=".48" stop-color="#121631"/><stop offset="1" stop-color="#071D28"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39E6DF"/><stop offset=".55" stop-color="#A48BFF"/><stop offset="1" stop-color="#FF66B5"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7257F9" stop-opacity=".42"/><stop offset="1" stop-color="#7357F9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="37" height="37" patternUnits="userSpaceOnUse"><path d="M37 0H0V37" fill="none" stroke="#66B5D9" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
</defs><style>
@keyframes glimmer{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes orbit{to{stroke-dashoffset:-360}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes travel{0%{transform:translateX(-180px)}100%{transform:translateX(1240px)}}
@keyframes beam{0%{transform:translateY(-120px)}100%{transform:translateY(140px)}}
@keyframes expand{0%,100%{opacity:.25}50%{opacity:.65}}
@keyframes type{0%,8%{opacity:0}22%,100%{opacity:1}}
.pulse{animation:glimmer 2.8s ease-in-out infinite}
.orbit{animation:orbit 24s linear infinite}
.float{animation:drift 5.5s ease-in-out infinite}
.beam{animation:travel 11s linear infinite}
.scan{animation:beam 3.5s ease-in-out infinite alternate}
.soft{animation:expand 4s ease-in-out infinite}
.appear{animation:type 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pulse,.orbit,.float,.beam,.scan,.soft,.appear{animation:none}}
</style>
<rect width="1400" height="418" rx="21" fill="url(#bg)"/><rect width="1400" height="418" rx="21" fill="url(#grid)"/>
<circle cx="1143" cy="181" r="290" fill="url(#halo)"/><circle cx="115" cy="385" r="230" fill="url(#halo)" opacity=".35"/>
<g fill="none" stroke="#68EFE8" stroke-width="1.8" opacity=".75">
 <circle cx="1142" cy="192" r="159" stroke-dasharray="5 21" class="orbit"/>
 <circle cx="1142" cy="192" r="133" stroke-opacity=".25"/>
 <circle cx="1142" cy="192" r="107" stroke="#A38AFF" stroke-dasharray="37 13" class="orbit"/>
 <circle cx="1142" cy="192" r="71" stroke="#FF69C3" stroke-opacity=".5" stroke-dasharray="3 16"/>
 <path d="M945 192h395M1142 12v360" stroke-opacity=".10"/>
</g>
<g fill="none" stroke="url(#neon)" stroke-width="2.2" stroke-linejoin="round">
 <path d="M0 56h176l24 26h92"/><path d="M0 367h126l31-28h172"/>
 <path d="M1400 52h-155l-31 33h-72"/><path d="M1400 367h-125l-33-33h-72"/>
</g>
<g fill="#95FCF0" class="float"><circle cx="1029" cy="91" r="4"/><circle cx="1248" cy="261" r="4"/><circle cx="1181" cy="43" r="3"/></g>
<g font-family="Segoe UI,Arial,sans-serif">
 <rect x="63" y="56" width="164" height="31" rx="15" fill="#123B42" stroke="#2F9698"/>
 <circle cx="82" cy="71" r="5" fill="#5EEDAE" class="pulse"/>
 <text x="98" y="77" font-size="13" font-weight="700" letter-spacing="2.1" fill="#A9F9EC">SYSTEM ONLINE</text>
 <text x="62" y="142" font-size="22" letter-spacing="6" fill="#9EB5D6" font-weight="700">SOFTWARE ENGINEER  /  AI BUILDER</text>
 <text x="58" y="244" font-size="88" fill="#F4F7FF" font-weight="850" letter-spacing="1">IHTISHAM</text>
