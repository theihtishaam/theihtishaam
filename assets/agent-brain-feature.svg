<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="389" viewBox="0 0 1200 389" role="img" aria-label="Agent Shadow Brain workflow"><title>Agent Shadow Brain workflow</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91b7b2" stroke-opacity=".06"/></pattern></defs><rect width="1200" height="389" rx="16" fill="#091416"/><rect width="1200" height="389" rx="16" fill="url(#grid)"/><style>@keyframes flow{to{stroke-dashoffset:-72}}@keyframes blink{50%{opacity:.4}}.flow{animation:flow 5s linear infinite}.pulse{animation:blink 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="44" y="45" fill="#a8e4c6" font-size="15" font-weight="600" font-family="Segoe UI,Arial,sans-serif">01  /  THE SHARED MEMORY</text><text x="44" y="107" fill="#f0f5ec" font-size="43" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Agent Shadow Brain</text><text x="44" y="145" fill="#b8c8c9" font-size="21" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Give coding agents a memory they can work with.</text><text x="44" y="193" fill="#b8c8c9" font-size="18" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Project knowledge, focused context, and a visual workspace.</text><text x="44" y="222" fill="#b8c8c9" font-size="18" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Built for tools connected through MCP. Stored locally.</text><rect x="44" y="285" width="254" height="72" rx="8" fill="#102326" stroke="#35514f"/><text x="62" y="313" fill="#a8e4c6" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif">01</text><text x="62" y="339" fill="#e8eee9" font-size="18" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Bring knowledge</text><path d="M298 321h32" stroke="#a8e4c6" stroke-dasharray="4 4" class="flow"/><rect x="330" y="285" width="254" height="72" rx="8" fill="#102326" stroke="#35514f"/><text x="348" y="313" fill="#a8e4c6" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif">02</text><text x="348" y="339" fill="#e8eee9" font-size="18" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Build context</text><path d="M584 321h32" stroke="#a8e4c6" stroke-dasharray="4 4" class="flow"/><rect x="616" y="285" width="254" height="72" rx="8" fill="#102326" stroke="#35514f"/><text x="634" y="313" fill="#a8e4c6" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif">03</text><text x="634" y="339" fill="#e8eee9" font-size="18" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Work together</text><path d="M870 321h32" stroke="#a8e4c6" stroke-dasharray="4 4" class="flow"/><rect x="902" y="285" width="254" height="72" rx="8" fill="#102326" stroke="#35514f"/><text x="920" y="313" fill="#a8e4c6" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif">04</text><text x="920" y="339" fill="#e8eee9" font-size="18" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Review outcomes</text></svg>