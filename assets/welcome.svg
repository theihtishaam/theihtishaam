<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="158" viewBox="0 0 1200 158" role="img" aria-label="Engineering for impact. Software systems. AI Agents. Automation."><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F21"/><stop offset=".55" stop-color="#111530"/><stop offset="1" stop-color="#071D2A"/></linearGradient><linearGradient id="g"><stop stop-color="#58F0E5"/><stop offset=".48" stop-color="#A395FF"/><stop offset="1" stop-color="#FF7DBF"/></linearGradient><pattern id="p" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#aabbe9" stroke-opacity=".07"/></pattern></defs><style>@keyframes sweep{0%{transform:translateX(-1250px)}100%{transform:translateX(1250px)}}@keyframes breathe{50%{opacity:.35}}@keyframes orbit{to{stroke-dashoffset:-275}}@keyframes rise{50%{transform:translateY(-5px)}}.sweep{animation:sweep 9s linear infinite}.pulse{animation:breathe 3s ease-in-out infinite}.orbit{animation:orbit 17s linear infinite}.rise{animation:rise 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.pulse,.orbit,.rise{animation:none}}</style><rect width="1200" height="158" rx="16" fill="url(#b)"/><rect width="1200" height="158" rx="16" fill="url(#p)"/><circle cx="1080" cy="79" r="62" stroke="#72F2E7" stroke-width="2" stroke-dasharray="15 10" fill="none" class="orbit"/><circle cx="1080" cy="79" r="40" stroke="#A790FA" stroke-width="2" fill="none"/><text x="31" y="42" font-size="17" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#76F2E7" letter-spacing="3">PROFILE / BUILDING THE NEXT</text><text x="30" y="93" font-size="37" font-family="Segoe UI,Arial,sans-serif" font-weight="850" fill="#F4F7FF">ENGINEERING WITH PURPOSE.</text><text x="32" y="128" fill="#B6C5DE" font-size="17" font-family="Segoe UI,Arial,sans-serif">AI agents • full-stack software • automation • evidence-led decision systems</text></svg>