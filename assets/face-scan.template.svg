<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ihtisham Ahmad’s GitHub avatar</title>
  <desc id="desc">The public GitHub avatar of Ihtisham Ahmad with a decorative scan effect.</desc>
  <defs>
    <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#132943"/></linearGradient>
    <radialGradient id="glow" cx=".16" cy=".48" r=".51"><stop stop-color="#2c6996" stop-opacity=".58"/><stop offset="1" stop-color="#183f63" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x2="0" y2="1"><stop stop-color="#8ad7ff" stop-opacity="0"/><stop offset=".89" stop-color="#9bdcff" stop-opacity=".30"/><stop offset="1" stop-color="#c0e9ff" stop-opacity=".86"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
    <clipPath id="photo"><circle cx="179" cy="149" r="96"/></clipPath>
  </defs>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif}
    .scan{animation:scan 5.2s ease-in-out infinite}
    @keyframes scan{0%,12%{transform:translateY(-100px);opacity:0}23%{opacity:.8}70%{transform:translateY(109px);opacity:.8}80%,100%{transform:translateY(109px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.scan{animation:none;display:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#ground)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <g fill="none" stroke="#9acbed" stroke-opacity=".15" stroke-width="1.4">
      <path d="M833 301C956 245 992 125 1094 75c40-20 76-28 107-33"/>
      <path d="M894 301C995 247 1015 156 1104 106c33-19 62-28 97-34"/>
      <path d="M962 301C1041 251 1064 188 1122 148c24-16 52-26 79-32"/>
      <path d="M1030 301C1090 255 1117 206 1158 183c14-8 28-13 43-18"/>
    </g>
    <circle cx="179" cy="149" r="113" fill="none" stroke="#6eafd5" stroke-opacity=".63" stroke-width="1.4"/>
    <circle cx="179" cy="149" r="102" fill="#132a43" stroke="#92d5f7" stroke-opacity=".52" stroke-width="1.4"/>
    <image href="{{AVATAR_DATA_URI}}" x="83" y="53" width="192" height="192" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)"/>
    <g clip-path="url(#photo)"><rect class="scan" x="81" y="117" width="196" height="31" fill="url(#scan)"/></g>
    <path d="M63 94V34h60m112 0h60v60M63 205v60h60m112 0h60v-60" fill="none" stroke="#88cef4" stroke-width="2.6"/>
    <text x="351" y="132" fill="#eff7ff" font-size="61" font-weight="750" letter-spacing="-1.5">Ihtisham Ahmad</text>
    <text x="355" y="186" fill="#c0dff4" font-size="31" font-weight="600">Software · automation · agent tools</text>
    <text x="355" y="227" fill="#aecce5" font-size="25">C# / .NET · Python · TypeScript</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="15" fill="none" stroke="#6b91b9" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
