<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="354" viewBox="0 0 1200 354" role="img" aria-label="Decorative scanning graphic with the public GitHub avatar, cyber interface, and engineering technology names"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071020"/><stop offset=".55" stop-color="#101432"/><stop offset="1" stop-color="#071d28"/></linearGradient><linearGradient id="glow" x2="1"><stop stop-color="#4ddfe7"/><stop offset=".54" stop-color="#a58bff"/><stop offset="1" stop-color="#ff5cc3"/></linearGradient><radialGradient id="neb"><stop stop-color="#7150e6" stop-opacity=".29"/><stop offset="1" stop-color="#7150e6" stop-opacity="0"/></radialGradient><filter id="b"><feGaussianBlur stdDeviation="16"/></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#64dcea" stroke-opacity=".10" fill="none"/></pattern></defs><style>@keyframes pulse{0%,100%{opacity:.22}50%{opacity:.85}}@keyframes glide{0%{transform:translateX(-115%)}100%{transform:translateX(130%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.spin{transform-origin:220px 184px;animation:spin 24s linear infinite}.sweep{animation:glide 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="portrait"><circle cx="203" cy="176" r="106"/></clipPath><linearGradient id="scanline" x2="0" y2="1"><stop stop-color="#6dfff1" stop-opacity="0"/><stop offset=".6" stop-color="#6dfff1" stop-opacity=".23"/><stop offset="1" stop-color="#6dfff1" stop-opacity=".85"/></linearGradient></defs><rect width="1200" height="354" rx="18" fill="url(#bg)"/><rect width="1200" height="354" rx="18" fill="url(#grid)"/><circle cx="203" cy="176" r="134" fill="none" stroke="#52eee6" stroke-opacity=".65" stroke-width="2" stroke-dasharray="14 10" class="spin"/><circle cx="203" cy="176" r="119" fill="none" stroke="#9177f5" stroke-opacity=".5" stroke-width="3"/><circle cx="203" cy="176" r="108" fill="#182744"/><image href="{{AVATAR_DATA_URI}}" x="97" y="70" width="212" height="212" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><g clip-path="url(#portrait)"><rect x="97" y="45" width="212" height="28" fill="url(#scanline)" class="sweep"/><rect x="97" y="102" width="212" height="3" fill="#68ffee" class="pulse"/></g><path d="M90 120V64h56M260 64h56v56M90 234v56h56M260 290h56v-56" fill="none" stroke="#75fcec" stroke-width="5"/><g font-family="Segoe UI,Inter,Arial,sans-serif"><text x="375" y="67" fill="#87efff" font-size="19" letter-spacing="5">01 / VISUAL IDENTITY</text><text x="374" y="127" fill="#fff" font-size="44" font-weight="800">HELLO, I'M IHTISHAM</text><text x="377" y="161" fill="#a3afd0" font-size="19">Building practical software and intelligent workflows</text><g font-size="17" font-weight="700"><rect x="377" y="193" width="173" height="48" rx="10" fill="#152940" stroke="#4bbaea"/><text x="462" y="224" text-anchor="middle" fill="#b7eafa">C# / .NET</text><rect x="564" y="193" width="173" height="48" rx="10" fill="#192843" stroke="#a18bf6"/><text x="651" y="224" text-anchor="middle" fill="#dfcbff">PYTHON / AI</text><rect x="751" y="193" width="173" height="48" rx="10" fill="#152940" stroke="#4bbaea"/><text x="837" y="224" text-anchor="middle" fill="#b7eafa">TYPESCRIPT</text><rect x="938" y="193" width="192" height="48" rx="10" fill="#192843" stroke="#a18bf6"/><text x="1034" y="224" text-anchor="middle" fill="#dfcbff">AGENT SYSTEMS</text></g><text x="378" y="290" fill="#7de9b9" font-size="18" font-weight="700" letter-spacing="2" class="pulse">●  PUBLIC PROFILE ONLINE</text><text x="377" y="320" fill="#8795b6" font-size="13">Avatar sourced from the current GitHub profile • decorative scan, not biometric verification</text></g><rect x="1.5" y="1.5" width="1197" height="351" rx="16" fill="none" stroke="#45617a" stroke-opacity=".7" stroke-width="3"/></svg>