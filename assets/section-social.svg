<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="98" viewBox="0 0 1200 98" role="img" aria-label="CONNECT &amp; SOCIAL PROFILES"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F21"/><stop offset=".55" stop-color="#111530"/><stop offset="1" stop-color="#071D2A"/></linearGradient><linearGradient id="g"><stop stop-color="#58F0E5"/><stop offset=".48" stop-color="#A395FF"/><stop offset="1" stop-color="#FF7DBF"/></linearGradient><pattern id="p" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#aabbe9" stroke-opacity=".07"/></pattern></defs><style>@keyframes sweep{0%{transform:translateX(-1250px)}100%{transform:translateX(1250px)}}@keyframes breathe{50%{opacity:.35}}@keyframes orbit{to{stroke-dashoffset:-275}}@keyframes rise{50%{transform:translateY(-5px)}}.sweep{animation:sweep 9s linear infinite}.pulse{animation:breathe 3s ease-in-out infinite}.orbit{animation:orbit 17s linear infinite}.rise{animation:rise 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.pulse,.orbit,.rise{animation:none}}</style><rect width="1200" height="98" rx="13" fill="url(#b)"/><rect width="1200" height="98" rx="13" fill="url(#p)"/><rect x="19" y="17" width="66" height="64" rx="10" fill="#1A2A4A" stroke="#70EBE7" stroke-opacity=".8"/><text x="52" y="59" text-anchor="middle" fill="#70EBE7" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="900">01</text><text x="105" y="52" fill="#F4F7FF" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="850">CONNECT &amp; SOCIAL PROFILES</text><text x="107" y="77" fill="#9CABD0" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">VERIFIED LINKS / PUBLIC PROFILES</text><rect x="930" y="28" width="220" height="2" fill="#70EBE7" opacity=".6"/><rect x="960" y="28" width="75" height="2" fill="#f6fffe" class="sweep"/><circle cx="1148" cy="52" r="9" fill="none" stroke="#70EBE7" stroke-width="3" class="pulse"/><rect x="1" y="1" width="1198" height="96" rx="13" fill="none" stroke="#70EBE7" stroke-opacity=".35"/></svg>