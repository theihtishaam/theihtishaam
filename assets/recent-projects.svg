<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Public project feed will update automatically"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071020"/><stop offset=".55" stop-color="#101432"/><stop offset="1" stop-color="#071d28"/></linearGradient><linearGradient id="glow" x2="1"><stop stop-color="#4ddfe7"/><stop offset=".54" stop-color="#a58bff"/><stop offset="1" stop-color="#ff5cc3"/></linearGradient><radialGradient id="neb"><stop stop-color="#7150e6" stop-opacity=".29"/><stop offset="1" stop-color="#7150e6" stop-opacity="0"/></radialGradient><filter id="b"><feGaussianBlur stdDeviation="16"/></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#64dcea" stroke-opacity=".10" fill="none"/></pattern></defs><rect width="1200" height="220" rx="17" fill="url(#bg)"/><rect width="1200" height="220" rx="17" fill="url(#grid)"/><text x="42" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#72f1e0" letter-spacing="4">PUBLIC PROJECTS / LIVE FEED</text><text x="42" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="34" fill="#f8faff" font-weight="800">New repositories appear automatically</text><text x="42" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bbd3">The first GitHub Actions refresh will populate the latest project cards.</text><rect x="1.5" y="1.5" width="1197" height="217" rx="15" fill="none" stroke="#526b85" stroke-width="3"/></svg>