<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" role="img" aria-label="Build something meaningful — ship with care"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071020"/><stop offset=".55" stop-color="#101432"/><stop offset="1" stop-color="#071d28"/></linearGradient><linearGradient id="glow" x2="1"><stop stop-color="#4ddfe7"/><stop offset=".54" stop-color="#a58bff"/><stop offset="1" stop-color="#ff5cc3"/></linearGradient><radialGradient id="neb"><stop stop-color="#7150e6" stop-opacity=".29"/><stop offset="1" stop-color="#7150e6" stop-opacity="0"/></radialGradient><filter id="b"><feGaussianBlur stdDeviation="16"/></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#64dcea" stroke-opacity=".10" fill="none"/></pattern></defs><style>@keyframes pulse{0%,100%{opacity:.22}50%{opacity:.85}}@keyframes glide{0%{transform:translateX(-115%)}100%{transform:translateX(130%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.spin{transform-origin:220px 184px;animation:spin 24s linear infinite}.sweep{animation:glide 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="126" rx="15" fill="url(#bg)"/><rect width="1200" height="126" rx="15" fill="url(#grid)"/><path d="M30 63h160m820 0h160" stroke="url(#glow)" stroke-width="3"/><text x="600" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#f2f6ff" font-family="Segoe UI,Inter,Arial,sans-serif">BUILD SOMETHING MEANINGFUL.</text><text x="600" y="94" text-anchor="middle" font-size="20" font-weight="600" fill="#87eee4" letter-spacing="4" font-family="Segoe UI,Inter,Arial,sans-serif">SHIP WITH CARE.</text></svg>