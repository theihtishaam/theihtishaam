<svg xmlns="http://www.w3.org/2000/svg" width="428" height="278" viewBox="0 0 428 278" role="img" aria-label="CIVICTWIN Scenario changes · proof receipts">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1E"/><stop offset=".48" stop-color="#121631"/><stop offset="1" stop-color="#071D28"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39E6DF"/><stop offset=".55" stop-color="#A48BFF"/><stop offset="1" stop-color="#FF66B5"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7257F9" stop-opacity=".42"/><stop offset="1" stop-color="#7357F9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="37" height="37" patternUnits="userSpaceOnUse"><path d="M37 0H0V37" fill="none" stroke="#66B5D9" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
</defs><style>
@keyframes glimmer{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes orbit{to{stroke-dashoffset:-360}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes travel{0%{transform:translateX(-180px)}100%{transform:translateX(1240px)}}
@keyframes beam{0%{transform:translateY(-120px)}100%{transform:translateY(140px)}}
@keyframes expand{0%,100%{opacity:.25}50%{opacity:.65}}
@keyframes type{0%,8%{opacity:0}22%,100%{opacity:1}}
.pulse{animation:glimmer 2.8s ease-in-out infinite}
.orbit{animation:orbit 24s linear infinite}
.float{animation:drift 5.5s ease-in-out infinite}
.beam{animation:travel 11s linear infinite}
.scan{animation:beam 3.5s ease-in-out infinite alternate}
.soft{animation:expand 4s ease-in-out infinite}
.appear{animation:type 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pulse,.orbit,.float,.beam,.scan,.soft,.appear{animation:none}}
</style><rect width="428" height="278" rx="17" fill="url(#bg)"/><rect width="428" height="278" rx="17" fill="url(#grid)"/>
<circle cx="335" cy="78" r="91" fill="url(#halo)" opacity=".8"/>
<rect x="20" y="22" width="102" height="27" rx="12" fill="#162841" stroke="#AE98FF" stroke-opacity=".9"/>
