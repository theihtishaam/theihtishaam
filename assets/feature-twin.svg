<text x="20" y="164" font-family="Segoe UI,Arial,sans-serif" font-weight="850" font-size="31" fill="#F4F6FF">DELTA  Δ</text>
<text x="20" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#B5C3DF">Scenario changes · proof receipts</text>
