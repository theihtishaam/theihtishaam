<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="266" viewBox="0 0 1100 266" role="img" aria-label="Decorative identity scanner with neon sweep animations and software engineering disciplines">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1E"/><stop offset=".48" stop-color="#121631"/><stop offset="1" stop-color="#071D28"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39E6DF"/><stop offset=".55" stop-color="#A48BFF"/><stop offset="1" stop-color="#FF66B5"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7257F9" stop-opacity=".42"/><stop offset="1" stop-color="#7357F9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="37" height="37" patternUnits="userSpaceOnUse"><path d="M37 0H0V37" fill="none" stroke="#66B5D9" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
</defs><style>
@keyframes glimmer{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes orbit{to{stroke-dashoffset:-360}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes travel{0%{transform:translateX(-180px)}100%{transform:translateX(1240px)}}
@keyframes beam{0%{transform:translateY(-120px)}100%{transform:translateY(140px)}}
@keyframes expand{0%,100%{opacity:.25}50%{opacity:.65}}
@keyframes type{0%,8%{opacity:0}22%,100%{opacity:1}}
.pulse{animation:glimmer 2.8s ease-in-out infinite}
.orbit{animation:orbit 24s linear infinite}
.float{animation:drift 5.5s ease-in-out infinite}
.beam{animation:travel 11s linear infinite}
.scan{animation:beam 3.5s ease-in-out infinite alternate}
.soft{animation:expand 4s ease-in-out infinite}
.appear{animation:type 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pulse,.orbit,.float,.beam,.scan,.soft,.appear{animation:none}}
</style>
<rect width="1100" height="266" rx="18" fill="url(#bg)"/><rect width="1100" height="266" rx="18" fill="url(#grid)"/>
<circle cx="143" cy="132" r="98" fill="none" stroke="#3EEADB" stroke-dasharray="19 11" stroke-width="2" class="orbit"/>
<circle cx="143" cy="132" r="78" fill="#112942" stroke="#A58BFF" stroke-width="2"/>
<g fill="none" stroke="#7FFDF2" stroke-width="4"><path d="M89 109V80h28M168 80h28v29M89 155v29h28M168 184h28v-29"/></g>
<g class="scan"><path d="M94 99h99" stroke="#64FFE6" stroke-width="4" filter="url(#blur)"/><path d="M94 101h99" stroke="#64FFE6" stroke-width="2"/></g>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="284" y="54" fill="#6AEFE3" font-weight="750" font-size="16" letter-spacing="4">IDENTITY INTERFACE // VISUAL SCAN</text>
<text x="284" y="113" fill="#F5F7FF" font-weight="850" font-size="38">IDEAS INTO WORKING SYSTEMS.</text>
<text x="285" y="151" fill="#B5C3E3" font-size="18">AI coding tools • evidence-led workflows • scalable web products</text>
<rect x="285" y="176" width="155" height="43" rx="10" fill="#162B3C" stroke="#4DDAD8"/>
<rect x="451" y="176" width="155" height="43" rx="10" fill="#1B2641" stroke="#AE88F2"/>
<rect x="617" y="176" width="155" height="43" rx="10" fill="#162B3C" stroke="#4DDAD8"/>
<rect x="783" y="176" width="225" height="43" rx="10" fill="#1B2641" stroke="#AE88F2"/>
<text x="362" y="204" text-anchor="middle" fill="#BBFAF6" font-size="16" font-weight="750">C# / .NET</text>
<text x="528" y="204" text-anchor="middle" fill="#E6D8FF" font-size="16" font-weight="750">PYTHON</text>
<text x="694" y="204" text-anchor="middle" fill="#BBFAF6" font-size="16" font-weight="750">TYPESCRIPT</text>
<text x="895" y="204" text-anchor="middle" fill="#E6D8FF" font-size="16" font-weight="750">AGENT WORKFLOWS</text>
<text x="284" y="248" fill="#75F4B1" font-size="14" font-weight="750" letter-spacing="2" class="pulse">● PUBLIC ENGINEERING PROFILE ACTIVE</text>
</g>
<rect x="1" y="1" width="1098" height="264" rx="17" fill="none" stroke="#4A6B8F" stroke-width="2"/>
</svg>